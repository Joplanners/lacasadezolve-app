# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Monitor npm dependencies for security vulnerabilities and updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    # Limit to 5 PRs per week to avoid overwhelming
    open-pull-requests-limit: 5
    # Group minor and patch updates together to reduce noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Auto-assign reviewers (optional: add your GitHub username)
    # reviewers:
    #   - "your-github-username"

  # Monitor GitHub Actions for updates too
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
