# netlify.toml (en la raíz de lacasadezolve-app/)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions" # Correcto, le dice a Netlify dónde están tus funciones

[build.environment]
  NODE_VERSION = "22.23.4"

[functions]
  node_bundler = "esbuild" # Asegura que se use esbuild, que maneja bien ESM
  # Opcional: si necesitas una versión específica de Node.js para tus funciones
  # node_version = "18" # o "20", etc.

# SPA fallback: rutas dinámicas (como /producto/:id) cargan index.html
# para que Vue Router se encargue del enrutamiento del lado del cliente.
# Netlify sirve los archivos estáticos pre-renderizados por vite-ssg primero;
# esta regla solo aplica cuando NO existe un archivo .html estático.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200